
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-utils"
version = "0.1.1"
description = "Reusable machine learning utilities"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "torchinfo",
    "tqdm",
    "sentence-transformers",
    "transformers",
    "matplotlib",
    "pandas",
    "nbformat"
]

[tool.setuptools.packages.find]
where = ["src"]
